<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <title>PaperStamp Designer</title>
    <link rel='icon' type='image/svg+xml' href='assets/favicon.svg' />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #paperstamp {
        width: 100%;
        height: 100%;
      }
    </style>
    <script src='src/sdk.js'></script>
  </head>
  <body>
    <div id='paperstamp'></div>
    <script>
      PaperStamp.embed({
        container: document.getElementById('paperstamp'),
        showDesigner: true,
        width: '100%',
        height: '100%',
        position: 'relative'
      });
    </script>
  </body>
</html>
