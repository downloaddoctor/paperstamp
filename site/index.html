<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperStamp Designer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #f5f6f9;
      }

      #host {
        position: fixed;
        inset: 0;
      }

      #host iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div id="host"></div>
    <script>
      document.write(
        '<script src="' +
          (/[?&]dev=1(&|$)/.test(location.search)
            ? 'paperstamp.dev.js'
            : 'paperstamp.min.js') +
          '"><\/script>'
      );
    </script>
    <script>
      var lp = PaperStamp.embed({
        container: document.getElementById('host'),
        width: '100%',
        height: '100%',
        position: 'static',
        hidden: false,
        autoShow: false,
        onReady: function () {
          lp.openDesigner();
        }
      });
    </script>
  </body>
</html>
